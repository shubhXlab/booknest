    <path d="M8 12 Q8 16 12 18 Q16 20 20 18 Q24 16 24 12 Q24 8 16 6 Q8 8 8 12 Z" 
          fill="none" stroke="url(#leafGradient)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <ellipse cx="12" cy="14" rx="2.5" ry="3.5" fill="url(#accentGradient)"/>
    <ellipse cx="17" cy="15" rx="2" ry="3" fill="url(#accentGradient)" transform="rotate(-15 17 15)"/>
    <ellipse cx="9" cy="15" rx="2" ry="3" fill="url(#accentGradient)" transform="rotate(15 9 15)"/>
