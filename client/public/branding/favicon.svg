<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a7c4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d663d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9214;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8740d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="14" fill="#ffffff"/>
  <circle cx="16" cy="16" r="14" fill="none" stroke="#e5e5e5" stroke-width="1"/>
  
  <!-- Nest -->
