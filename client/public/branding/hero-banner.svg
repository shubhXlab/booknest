<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f5f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8efe8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a7c4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d663d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9214;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8740d;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4a7c4a;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#4a7c4a;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGradient)"/>
  
  <!-- Subtle glow -->
  <ellipse cx="900" cy="200" rx="300" ry="200" fill="url(#glow)"/>
  
  <!-- Decorative leaves pattern -->
  <g opacity="0.03">
    <g transform="translate(100, 100) scale(0.8)">
      <path d="M24 32 Q24 40 32 44 Q40 48 48 44 Q56 40 56 32 Q56 24 48 20 Q40 16 32 20 Q24 24 24 32 Z" fill="url(#leafGradient)"/>
    </g>
    <g transform="translate(1000, 400) scale(0.6) rotate(45)">
      <path d="M24 32 Q24 40 32 44 Q40 48 48 44 Q56 40 56 32 Q56 24 48 20 Q40 16 32 20 Q24 24 24 32 Z" fill="url(#leafGradient)"/>
    </g>
    <g transform="translate(200, 500) scale(0.5) rotate(-30)">
      <path d="M24 32 Q24 40 32 44 Q40 48 48 44 Q56 40 56 32 Q56 24 48 20 Q40 16 32 20 Q24 24 24 32 Z" fill="url(#leafGradient)"/>
    </g>
    <g transform="translate(1100, 150) scale(0.4) rotate(120)">
      <path d="M24 32 Q24 40 32 44 Q40 48 48 44 Q56 40 56 32 Q56 24 48 20 Q40 16 32 20 Q24 24 24 32 Z" fill="url(#leafGradient)"/>
    </g>
  </g>
  
  <!-- Main content -->
  <g transform="translate(100, 150)">
    <!-- Large nest icon -->
    <g transform="scale(2.5)">
      <path d="M24 32 Q24 40 32 44 Q40 48 48 44 Q56 40 56 32 Q56 24 48 20 Q40 16 32 20 Q24 24 24 32 Z" 
            fill="url(#leafGradient)" opacity="0.15"/>
      <path d="M24 32 Q24 40 32 44 Q40 48 48 44 Q56 40 56 32 Q56 24 48 20 Q40 16 32 20 Q24 24 24 32 Z" 
            fill="none" stroke="url(#leafGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <ellipse cx="32" cy="34" rx="6" ry="8" fill="url(#accentGradient)"/>
      <ellipse cx="42" cy="36" rx="5" ry="7" fill="url(#accentGradient)" transform="rotate(-15 42 36)"/>
      <ellipse cx="25" cy="36" rx="5" ry="7" fill="url(#accentGradient)" transform="rotate(15 25 36)"/>
      
      <ellipse cx="30" cy="31" rx="1.5" ry="2" fill="rgba(255,255,255,0.4)"/>
      <ellipse cx="40" cy="33" rx="1.2" ry="1.8" fill="rgba(255,255,255,0.4)"/>
      <ellipse cx="23" cy="33" rx="1.2" ry="1.8" fill="rgba(255,255,255,0.4)"/>
    </g>
    
    <!-- Title -->
    <text x="180" y="60" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="56" font-weight="800" fill="#171717" letter-spacing="-2px">BookNest</text>
    
    <!-- Tagline -->
    <text x="180" y="115" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="22" font-weight="400" fill="#525252" letter-spacing="0.5px">Your reading sanctuary. Track, discover, and cherish every story.</text>
    
    <!-- CTA button -->
    <g transform="translate(180, 140)">
      <rect x="0" y="0" width="220" height="52" rx="8" fill="url(#leafGradient)"/>
      <text x="110" y="34" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Start Reading Free</text>
    </g>
    
    <!-- Secondary CTA -->
    <text x="180" y="225" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="15" font-weight="500" fill="#4a7c4a">← Or explore the demo</text>
    
    <!-- Stats row -->
    <g transform="translate(180, 280)">
      <g transform="translate(0, 0)">
        <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
              font-size="28" font-weight="700" fill="#4a7c4a">10K+</text>
        <text x="0" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
              font-size="13" font-weight="400" fill="#737373" text-transform="uppercase" letter-spacing="1px">Books Tracked</text>
      </g>
      <g transform="translate(140, 0)">
        <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
              font-size="28" font-weight="700" fill="#4a7c4a">5K+</text>
        <text x="0" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
              font-size="13" font-weight="400" fill="#737373" text-transform="uppercase" letter-spacing="1px">Active Readers</text>
      </g>
      <g transform="translate(280, 0)">
        <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
              font-size="28" font-weight="700" fill="#4a7c4a">50K+</text>
        <text x="0" y="24" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
              font-size="13" font-weight="400" fill="#737373" text-transform="uppercase" letter-spacing="1px">Reviews Written</text>
      </g>
    </g>
  </g>
  
  <!-- Subtle divider -->
  <line x1="100" y1="520" x2="1100" y2="520" stroke="#e5e5e5" stroke-width="1"/>
  
  <!-- Footer text -->
  <text x="600" y="555" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="12" font-weight="400" fill="#a3a3a3" text-anchor="middle">Built with care for book lovers everywhere</text>
</svg>